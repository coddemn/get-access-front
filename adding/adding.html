<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить запись — Менеджер паролей</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../manager/manager.css">
    <link rel="stylesheet" href="adding.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Менеджер</div>
        <nav class="nav-menu">
            <button class="nav-item" onclick="window.location.href='../manager/manager.html'">Мои Сервисы</button>
            <button class="nav-item" onclick="window.location.href='../profile/profile.html'">Профиль</button>
        </nav>
        <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
            <h1 class="page-title">Добавить новую запись</h1>
        </div>

        <!-- Обертка: центрирует и чуть поднимает форму -->
        <div class="add-wrapper">
            <div class="Frame1 add-form-frame">
                <form class="add-form" id="addForm">
                    <div class="form-group">
                        <label for="service">Имя сервиса</label>
                        <input type="text" id="service" class="form-input" required placeholder="Например: Google, VK, Netflix...">
                    </div>
                    <div class="form-group">
                        <label for="login">Логин</label>
                        <input type="text" id="login" class="form-input" required placeholder="Логин или email для входа">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="password-row">
                            <input type="password" id="password" class="form-input" required placeholder="Пароль">
                            <button type="button" class="toggle-pass-btn" id="togglePassBtn" onclick="togglePassVisibility()" title="Показать/скрыть пароль">👁</button>
                            <button type="button" class="gen-pass-btn" onclick="generatePassword()" title="Сгенерировать пароль">🎲</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="link">Ссылка</label>
                        <input type="url" id="link" class="form-input" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="desc">Описание</label>
                        <textarea id="desc" class="form-input form-textarea" placeholder="Заметка по сервису (необязательно)"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="button cancel-form-btn" onclick="window.location.href='../manager/manager.html'">Отмена</button>
                        <button type="submit" class="button save-form-btn">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../manager/manager.js"></script>
    <script src="adding.js"></script>
</body>
</html>
